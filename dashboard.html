<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard · Kreato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=12">
  <link rel="stylesheet" href="dashboard.css?v=12">
  <script src="proto-reset.js?v=12"></script>
</head>
<body class="dash">

<!-- Desktop sidebar (rendered by dashboard.js) -->
<aside class="side" aria-label="Main">
  <a class="brand" href="#"><span class="logo-mark">K</span>kreato</a>
  <nav id="side-nav"></nav>
  <div class="profile">
    <span class="avatar" id="avatar">H</span>
    <div class="who"><b id="who-name">Hanufa Islam</b><span id="who-handle">@hanufa</span></div>
    <button class="icon-btn" type="button" aria-label="Sign out" data-soon="Sign out"><i data-lucide="log-out"></i></button>
  </div>
</aside>

<div class="main">
    <header class="top">
    <a class="brand brand-m" href="#"><span class="logo-mark">K</span></a>
    <div class="menu-wrap">
      <button class="store-pill" id="store-pill" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="store-menu">
        <i data-lucide="store"></i><span>My Storefront</span><i data-lucide="chevron-down" class="pill-chev"></i>
      </button>
      <div class="menu" id="store-menu" role="menu" aria-label="Storefront options" hidden>
        <button type="button" role="menuitem" data-menu="copy"><i data-lucide="copy"></i>Copy store link</button>
        <button type="button" role="menuitem" data-menu="share"><i data-lucide="share-2"></i>Share link</button>
        <div class="menu-sep" role="separator"></div>
        <button type="button" role="menuitem" class="danger" data-menu="remove"><i data-lucide="trash-2"></i>Remove</button>
      </div>
    </div>
    <div class="top-r">
      <label class="viewas">
        <span class="sr-only">View as</span>
        <select id="viewas" aria-label="View as">
          <option value="new">New creator</option>
          <option value="active">Active creator</option>
        </select>
      </label>
      <button class="icon-btn bell" type="button" aria-label="Notifications" data-soon="Notifications"><i data-lucide="bell"></i><span class="notif" id="notif" hidden>0</span></button>
      <a class="btn btn-outline btn-sm hide-m" id="btn-preview" href="store.html"><i data-lucide="external-link"></i>View store</a>
      <a class="btn btn-primary btn-sm" id="btn-add" href="product-new.html?new=1"><i data-lucide="plus"></i><span>Add asset</span></a>
    </div>
  </header>

  <main class="content">

        <!-- ================= NEW CREATOR ================= -->
    <div id="view-new" class="view new-grid">
      <section class="card setup" aria-labelledby="setup-title">
        <div class="setup-head">
          <h2 id="setup-title">Set up your store</h2>
          <div class="setup-prog"><span id="prog-text">1/3 completed</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="prog-wrap"><i id="prog-bar"></i></div></div>
        </div>
        <ol class="acc-list" id="acc"></ol>
      </section>

      <aside class="side-col" aria-label="Help and extras">
        <section class="card help-mini">
          <a class="help-link" href="https://kreato.co.in/guides" target="_blank" rel="noopener">
            <i data-lucide="book-open"></i><span>How Kreato works</span><i data-lucide="external-link" class="ext"></i>
          </a>
        </section>

        <section class="card promo-card" id="promo-session">
          <span class="ic"><i data-lucide="video"></i></span>
          <div class="promo-text">
            <span class="badge" id="session-badge">Optional</span>
            <h3>Offer 1:1 sessions</h3>
            <p>Paid or free calls buyers can book</p>
          </div>
          <a class="btn btn-outline btn-sm" id="session-cta" href="session-setup.html">Start<i data-lucide="arrow-right"></i></a>
        </section>
      </aside>
    </div>

    <!-- ================= ACTIVE CREATOR ================= -->
    <div id="view-active" class="view" hidden>

      <section class="stats stats-live" id="stat-tabs" role="tablist" aria-label="Metrics"></section>

      <section class="card chart-card">
        <div class="chart-head">
          <div><span class="eyebrow" id="chart-label">Earnings</span><div class="chart-total" id="chart-total">₹0</div></div>
          <div class="seg" role="group" aria-label="Date range" id="range">
            <button type="button" aria-pressed="false" data-r="7">7D</button>
            <button type="button" aria-pressed="true" data-r="30">30D</button>
            <button type="button" aria-pressed="false" data-r="90">90D</button>
          </div>
        </div>
        <div class="chart" id="chart"></div>
      </section>

      <div class="two">
        <section class="card">
          <div class="card-head"><h3>Top assets</h3><a href="#" data-soon="My assets">View all</a></div>
          <ul class="list" id="top-assets"></ul>
        </section>
        <section class="card">
          <div class="card-head"><h3>Recent sales</h3><a href="#" data-soon="Sales">View all</a></div>
          <ul class="list" id="recent-sales"></ul>
        </section>
      </div>

      <div class="two">
        <button class="row-card card" type="button" data-soon="1:1 Sessions">
          <span class="ic"><i data-lucide="video"></i></span>
          <span class="grow"><b>2 upcoming sessions</b><small>Next: Today, 6:30 PM</small></span>
          <i data-lucide="chevron-right"></i>
        </button>
        <div class="linkbar card">
          <i data-lucide="store"></i><span class="url" data-store-url></span>
          <button class="btn btn-outline btn-sm" type="button" data-copy><i data-lucide="copy"></i>Copy</button>
          <button class="icon-btn" type="button" aria-label="QR code" data-soon="QR code"><i data-lucide="qr-code"></i></button>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Mobile bottom navigation -->
<nav class="tabbar" id="tabbar" aria-label="Primary"></nav>

<!-- Mobile "More" sheet -->
<div class="sheet-backdrop" id="sheet-bd" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="More" hidden>
  <div class="sheet-grip"></div>
  <div id="sheet-body"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="dashboard.js?v=12"></script>
</body>
</html>
